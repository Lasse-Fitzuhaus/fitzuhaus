<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dein erster Schritt</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      background-color: white;
      max-width: 600px;
      margin: 2rem;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
    }
    p {
      color: #555;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-top: 2rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .profile-pic {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="dein-foto.jpg" alt="Trainerbild" class="profile-pic">
    <h1>Schön, dass du hier bist!</h1>
    <p>Der erste Schritt ist getan – jetzt geht es darum, herauszufinden, was du verändern möchtest.</p>

    <form action="#" method="POST">
      <label for="ziel">Was möchtest du mit dem Coaching erreichen?</label>
      <textarea id="ziel" name="ziel" rows="4" required></textarea>

      <label for="huerden">Was hat dich bisher daran gehindert, dein Ziel zu erreichen?</label>
      <textarea id="huerden" name="huerden" rows="4"></textarea>

      <label for="kontakt">Wie kann ich dich erreichen? (z. B. E-Mail oder Telefonnummer)</label>
      <input type="text" id="kontakt" name="kontakt" required />

      <button type="submit">Absenden</button>
    </form>
  </div>
</body>
</html>
